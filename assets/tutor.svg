<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <rect width="1200" height="740" rx="14" fill="#0c0d12" stroke="#252733" stroke-width="2" />

  <!-- Titlebar -->
  <path d="M 0 14 A 14 14 0 0 1 14 0 L 1186 0 A 14 14 0 0 1 1200 14 L 1200 42 L 0 42 Z" fill="#13141a" />
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1f202b" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="600.0" y="26" fill="#757991" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">XVim Tutor — Интерактивный интерактивный курс [RU / EN]</text>

  <!-- Body Content -->
  
  <!-- Tabs -->
  <g transform="translate(0, 42)">
    <rect width="1200" height="32" fill="#0f1016" />
    <rect x="0" y="0" width="180" height="32" fill="#161722" stroke="#252737" stroke-width="1"/>
    <text x="24" y="21" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">lesson_01.xvim</text>
    <circle cx="160" cy="16" r="3.5" fill="#27c93f" />

    <text x="210" y="21" fill="#52556b" font-family="'JetBrains Mono', monospace" font-size="12">lesson_02.xvim</text>
    <text x="340" y="21" fill="#52556b" font-family="'JetBrains Mono', monospace" font-size="12">lesson_03.xvim</text>
    <line x1="0" y1="32" x2="1200" y2="32" stroke="#1f202b" stroke-width="1" />
  </g>

  <!-- Body -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13.5" transform="translate(40, 95)" xml:space="preserve">
    <!-- Header -->
    <rect x="0" y="0" width="1120" height="54" rx="8" fill="#141620" stroke="#282a3b" stroke-width="1" />
    <text x="24" y="23" fill="#a0a4b8" font-size="11" font-weight="600">XVIM TUTOR  •  ЭТАП 1 ИЗ 8</text>
    <text x="24" y="42" fill="#ffffff" font-size="14" font-weight="700">УРОК 1: Базовая навигация в Normal Mode (h, j, k, l)</text>
    <rect x="940" y="14" width="160" height="26" rx="13" fill="#1e202c" />
    <text x="1020" y="31" fill="#27c93f" font-size="11" font-weight="700" text-anchor="middle">ЯЗЫК: RU [:XVimLang en]</text>

    <!-- Theory -->
    <g transform="translate(0, 75)">
      <text x="0" y="20" fill="#ffffff" font-weight="700" font-size="14">1.1 ТЕОРИЯ</text>
      <text x="0" y="46" fill="#8f93a9">В XVim курсор управляется клавишами домашнего ряда:</text>
      <text x="24" y="74" fill="#ffffff"><tspan fill="#27c93f" font-weight="700">h</tspan> — влево        <tspan fill="#27c93f" font-weight="700">j</tspan> — вниз         <tspan fill="#27c93f" font-weight="700">k</tspan> — вверх        <tspan fill="#27c93f" font-weight="700">l</tspan> — вправо</text>
      <text x="0" y="106" fill="#8f93a9">Забудьте про стрелочки — ваши пальцы всегда должны оставаться в центре клавиатуры.</text>
    </g>

    <!-- Practice -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="1120" height="195" rx="8" fill="#101117" stroke="#242634" stroke-width="1" />
      <text x="24" y="28" fill="#ffffff" font-weight="700" font-size="14">1.2 ПРАКТИЧЕСКОЕ ЗАДАНИЕ</text>
      <text x="24" y="52" fill="#a0a4b8">Используя только клавиши навигации, доберитесь до маркера цели [X] и сотрите его.</text>

      <g transform="translate(24, 70)" font-size="13">
        <rect x="0" y="0" width="1070" height="100" rx="6" fill="#08090d" stroke="#181923" stroke-width="1" />
        <text x="18" y="28" fill="#52556b">1 |  const latency_target = 20; // milliseconds</text>
        <text x="18" y="54" fill="#52556b">2 |  function verify_performance() {</text>
        <text x="18" y="80" fill="#52556b">3 |      return "XVim engine ready"; <tspan fill="#27c93f" font-weight="700">[✓ TARGET REACHED]</tspan></text>
        <rect x="375" y="66" width="9" height="18" fill="#ffffff" />
      </g>
    </g>

    <!-- Verification Passed -->
    <g transform="translate(0, 435)">
      <rect x="0" y="0" width="1120" height="50" rx="8" fill="#13231a" stroke="#27c93f" stroke-width="1.2" />
      <text x="24" y="31" fill="#27c93f" font-weight="700" font-size="13.5">✓ ПРОВЕРКА ПРОЙДЕНА: Задание выполнено идеально! Нажмите &lt;leader&gt;tn для перехода к уроку 2.</text>
    </g>

    <!-- Hotkeys hint -->
    <g transform="translate(0, 520)" fill="#6d7085" font-size="12">
      <text x="0" y="15">Горячие клавиши тьютора:  <tspan fill="#ffffff">&lt;leader&gt;tc</tspan> — Проверить  |  <tspan fill="#ffffff">&lt;leader&gt;tn</tspan> — След. урок  |  <tspan fill="#ffffff">&lt;leader&gt;tp</tspan> — Пред. урок  |  <tspan fill="#ffffff">&lt;leader&gt;tr</tspan> — Сброс</text>
    </g>
  </g>

  <!-- Statusline -->
  <g transform="translate(0, 692)">
    <rect width="1200" height="28" fill="#090a0e" />
    <path d="M 12 5 A 8 8 0 0 1 20 5 L 85 5 A 8 8 0 0 1 93 13 L 93 15 A 8 8 0 0 1 85 23 L 20 23 A 8 8 0 0 1 12 15 Z" fill="#27c93f" />
    <text x="52" y="18" fill="#000000" font-weight="800" font-size="11" text-anchor="middle">TUTOR</text>

    <text x="110" y="18" fill="#ffffff" font-size="12" font-weight="600">lesson_01.xvim</text>
    <text x="240" y="18" fill="#6d7085" font-size="12">[ЭТАП 1 / 8: НАВИГАЦИЯ]</text>

    <text x="1000" y="18" fill="#6d7085" font-size="12">utf-8</text>
    <path d="M 1055 5 A 8 8 0 0 1 1063 5 L 1180 5 A 8 8 0 0 1 1188 13 L 1188 15 A 8 8 0 0 1 1180 23 L 1063 23 A 8 8 0 0 1 1055 15 Z" fill="#1b1c26" />
    <text x="1122" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">RU • STEP 1/8</text>
  </g>

</svg>