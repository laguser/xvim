<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <rect width="1200" height="740" rx="10" fill="#0c0d12" stroke="#23242e" stroke-width="1.5" />

  <!-- Titlebar -->
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 1190 0 A 10 10 0 0 1 1200 10 L 1200 38 L 0 38 Z" fill="#13141a" />
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#1f202b" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="24" cy="19" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="19" r="5.5" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="600.0" y="24" fill="#6d7085" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" text-anchor="middle">xvim — tutor [ru/en]</text>

  <!-- Body Content -->
  
  <!-- Tabs -->
  <g transform="translate(0, 38)">
    <rect width="1200" height="32" fill="#0f1016" />
    <rect x="0" y="0" width="180" height="32" fill="#14151f" stroke="#1f202b" stroke-width="1"/>
    <text x="24" y="21" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">lesson_01.xvim</text>
    <circle cx="160" cy="16" r="3" fill="#27c93f" />

    <text x="210" y="21" fill="#484a5c" font-family="'JetBrains Mono', monospace" font-size="12">lesson_02.xvim</text>
    <text x="340" y="21" fill="#484a5c" font-family="'JetBrains Mono', monospace" font-size="12">lesson_03.xvim</text>
    <line x1="0" y1="32" x2="1200" y2="32" stroke="#1a1b24" stroke-width="1" />
  </g>

  <!-- Body -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" transform="translate(40, 92)" xml:space="preserve">
    <!-- Header -->
    <rect x="0" y="0" width="1120" height="52" rx="6" fill="#13141c" stroke="#222330" stroke-width="1" />
    <text x="24" y="22" fill="#757991" font-size="10.5" font-weight="600">XVIM TUTOR  •  STAGE 1 / 8</text>
    <text x="24" y="40" fill="#ffffff" font-size="13.5" font-weight="700">УРОК 1: Базовая навигация в Normal Mode (h, j, k, l)</text>
    <rect x="950" y="13" width="150" height="26" rx="6" fill="#1a1b24" />
    <text x="1025" y="30" fill="#27c93f" font-size="11" font-weight="600" text-anchor="middle">ЯЗЫК: RU [:XVimLang en]</text>

    <!-- Theory -->
    <g transform="translate(0, 72)">
      <text x="0" y="20" fill="#ffffff" font-weight="700" font-size="13.5">1.1 ТЕОРИЯ</text>
      <text x="0" y="44" fill="#888899">Курсор управляется клавишами домашнего ряда:</text>
      <text x="24" y="70" fill="#ffffff"><tspan fill="#27c93f" font-weight="700">h</tspan> — влево        <tspan fill="#27c93f" font-weight="700">j</tspan> — вниз         <tspan fill="#27c93f" font-weight="700">k</tspan> — вверх        <tspan fill="#27c93f" font-weight="700">l</tspan> — вправо</text>
      <text x="0" y="100" fill="#6d7085">Пальцы остаются в центре клавиатуры, без использования стрелок.</text>
    </g>

    <!-- Practice -->
    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="1120" height="195" rx="6" fill="#101117" stroke="#1f202b" stroke-width="1" />
      <text x="24" y="28" fill="#ffffff" font-weight="700" font-size="13.5">1.2 ПРАКТИЧЕСКОЕ ЗАДАНИЕ</text>
      <text x="24" y="52" fill="#888899">Переместите курсор к маркеру [X] и сотрите его.</text>

      <g transform="translate(24, 70)" font-size="13">
        <rect x="0" y="0" width="1070" height="100" rx="6" fill="#08090d" stroke="#161720" stroke-width="1" />
        <text x="18" y="28" fill="#484a5c">1 |  const latency_target = 20; // ms</text>
        <text x="18" y="54" fill="#484a5c">2 |  function verify_performance() {</text>
        <text x="18" y="80" fill="#484a5c">3 |      return "xvim core ready"; <tspan fill="#27c93f" font-weight="700">[✓ TARGET REACHED]</tspan></text>
        <rect x="370" y="66" width="9" height="18" fill="#ffffff" />
      </g>
    </g>

    <!-- Verification Passed -->
    <g transform="translate(0, 425)">
      <rect x="0" y="0" width="1120" height="48" rx="6" fill="#112017" stroke="#27c93f" stroke-width="1" />
      <text x="24" y="30" fill="#27c93f" font-weight="700" font-size="13">✓ Задание выполнено. Нажмите &lt;leader&gt;tn для перехода к следующему уроку.</text>
    </g>

    <!-- Hotkeys hint -->
    <g transform="translate(0, 505)" fill="#52556b" font-size="11.5">
      <text x="0" y="15">Горячие клавиши:  <tspan fill="#ffffff">&lt;leader&gt;tc</tspan> Проверить  |  <tspan fill="#ffffff">&lt;leader&gt;tn</tspan> След. урок  |  <tspan fill="#ffffff">&lt;leader&gt;tp</tspan> Пред. урок  |  <tspan fill="#ffffff">&lt;leader&gt;tr</tspan> Сброс</text>
    </g>
  </g>

  <!-- Statusline -->
  <g transform="translate(0, 692)">
    <rect width="1200" height="28" fill="#090a0e" />
    <path d="M 12 5 A 8 8 0 0 1 20 5 L 85 5 A 8 8 0 0 1 93 13 L 93 15 A 8 8 0 0 1 85 23 L 20 23 A 8 8 0 0 1 12 15 Z" fill="#27c93f" />
    <text x="52" y="18" fill="#000000" font-weight="800" font-size="11" text-anchor="middle">TUTOR</text>

    <text x="110" y="18" fill="#ffffff" font-size="11.5" font-weight="600">lesson_01.xvim</text>
    <text x="240" y="18" fill="#52556b" font-size="11.5">[STAGE 1/8]</text>

    <text x="1040" y="18" fill="#52556b" font-size="11.5">utf-8</text>
    <path d="M 1085 5 A 8 8 0 0 1 1093 5 L 1180 5 A 8 8 0 0 1 1188 13 L 1188 15 A 8 8 0 0 1 1180 23 L 1093 23 A 8 8 0 0 1 1085 15 Z" fill="#181922" />
    <text x="1136" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">RU • 1/8</text>
  </g>

</svg>