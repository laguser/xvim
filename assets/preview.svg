            <rect x="0" y="0" width="280" height="26" fill="#1c1e2a" />
            <text x="12" y="18" fill="#27c93f" font-weight="700">󰊕  xvim_dispatch</text>
            <text x="268" y="18" fill="#757991" font-size="10" text-anchor="end">fn(&amp;ctx)</text>

            <text x="12" y="44" fill="#ffffff">󰊕  xvim_init</text>
            <text x="268" y="44" fill="#444655" font-size="10" text-anchor="end">fn(&amp;ctx)</text>

            <text x="12" y="70" fill="#ffffff">󰈙  xvim_ctx_t</text>
            <text x="268" y="70" fill="#444655" font-size="10" text-anchor="end">struct</text>

