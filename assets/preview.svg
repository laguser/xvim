        <!-- Code Lines -->
        <g font-family="'JetBrains Mono', monospace" font-size="12" transform="translate(55, 24)">
          <text y="0" fill="#484a5c">// xvim fast dispatch loop</text>
          <text y="44"><tspan fill="#ffffff" font-weight="700">#include</tspan> <tspan fill="#7d8196">&lt;stdio.h&gt;</tspan></text>
          <text y="66"><tspan fill="#ffffff" font-weight="700">#include</tspan> <tspan fill="#7d8196">&lt;xvim.h&gt;</tspan></text>

          <text y="110"><tspan fill="#ffffff" font-weight="700">int</tspan> <tspan fill="#ffffff">main</tspan>(<tspan fill="#ffffff" font-weight="700">int</tspan> argc, <tspan fill="#ffffff" font-weight="700">char</tspan> **argv) {</text>
          <text y="132" fill="#888899">    xvim_ctx_t ctx = {0};</text>
          
          <text y="176"><tspan fill="#ffffff" font-weight="700">    if</tspan> (!xvim_init(&amp;ctx)) {</text>
          <text y="198"><tspan fill="#ffffff">        return</tspan> 1;</text>
          <text y="220">    }</text>

          <text y="264" fill="#888899">    // event processing</text>
          <text y="286"><tspan fill="#ffffff">    xvim_dispatch</tspan>(&amp;ctx);</text>
          <text y="308">}</text>
        </g>

        <!-- Blink.cmp floating completion -->
        <g transform="translate(170, 215)">
          <rect width="280" height="155" rx="6" fill="#111219" stroke="#222432" stroke-width="1" />
          <rect width="280" height="22" rx="6" fill="#151620" />
