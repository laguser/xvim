        <text x="14" y="18" fill="#888899" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">COMPLETION (blink.cmp - Rust Fast)</text>

        <g transform="translate(0, 26)" font-family="'JetBrains Mono', monospace" font-size="12">
          <rect x="0" y="0" width="330" height="28" fill="#242738" />
          <text x="14" y="19" fill="#27c93f" font-weight="700">󰊕  xvim_dispatch_events</text>
          <text x="315" y="19" fill="#a0a4b8" font-size="10.5" text-anchor="end">Function</text>

          <text x="14" y="47" fill="#ffffff">󰊕  xvim_dispatch_keystroke</text>
          <text x="315" y="47" fill="#5c6077" font-size="10.5" text-anchor="end">Function</text>

          <text x="14" y="75" fill="#ffffff">󰈙  xvim_event_queue_t</text>
          <text x="315" y="75" fill="#5c6077" font-size="10.5" text-anchor="end">Struct</text>

          <text x="14" y="103" fill="#ffffff">󰊕  xvim_flush_screen</text>
          <text x="315" y="103" fill="#5c6077" font-size="10.5" text-anchor="end">Function</text>

          <text x="14" y="131" fill="#ffffff">󰈙  xvim_framebuffer_t</text>
          <text x="315" y="131" fill="#5c6077" font-size="10.5" text-anchor="end">Struct</text>
        </g>
      </g>

      <!-- Doc Preview -->
      <g transform="translate(540, 260)">
        <rect width="360" height="150" rx="8" fill="#0e0f16" stroke="#222534" stroke-width="1.2" />
        <text x="16" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11.5">void xvim_dispatch_events(lua_State *L)</text>
        <line x1="16" y1="36" x2="344" y2="36" stroke="#1d1f2b" stroke-width="1" />
        <text x="16" y="58" fill="#8f93a9" font-family="'JetBrains Mono', monospace" font-size="11">Flushes pending render pipeline and processes</text>
        <text x="16" y="76" fill="#8f93a9" font-family="'JetBrains Mono', monospace" font-size="11">queued input packets with zero memory allocation.</text>
        <text x="16" y="104" fill="#6d7085" font-family="'JetBrains Mono', monospace" font-size="11">Latency: ~0.02ms per call</text>
        <text x="16" y="126" fill="#27c93f" font-family="'JetBrains Mono', monospace" font-size="11">⚡ SIMD M4 Vectorized</text>
      </g>
