    <circle cx="360" cy="16" r="3" fill="#27c93f" />

    <text x="400" y="21" fill="#484a5c" font-family="'JetBrains Mono', monospace" font-size="12">tutor.lua</text>
    <text x="500" y="21" fill="#484a5c" font-family="'JetBrains Mono', monospace" font-size="12">.xvim.lua</text>
    <line x1="0" y1="32" x2="1200" y2="32" stroke="#1a1b24" stroke-width="1" />
  </g>

  <!-- Body -->
  <g transform="translate(0, 70)">
    <!-- Sidebar -->
    <rect width="220" height="579" fill="#0c0d12" />
    <line x1="220" y1="0" x2="220" y2="579" stroke="#1a1b24" stroke-width="1" />

    <g font-family="'JetBrains Mono', monospace" font-size="12" fill="#757991" transform="translate(20, 25)">
      <text y="0" fill="#ffffff" font-weight="700">▾ project</text>
      <text y="24">  ▾ src</text>
      <text y="48" fill="#ffffff" font-weight="700">    ▸ main.c</text>
      <text y="72">    ▸ engine.c</text>
      <text y="96">    ▸ runtime.c</text>
      <text y="120">  ▸ lua</text>
      <text y="144" fill="#27c93f">  ▸ .xvim.lua</text>
      <text y="168">  ▸ Makefile</text>
      <text y="192">  ▸ README.md</text>
    </g>

    <!-- Code Editor Area -->
    <g transform="translate(225, 0)">
      <!-- Line Numbers -->
      <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#383a48" transform="translate(15, 25)">
        <text y="0">1</text>
        <text y="24">2</text>
        <text y="48">3</text>
        <text y="72">4</text>
        <text y="96">5</text>
        <text y="120">6</text>
        <text y="144">7</text>
        <text y="168">8</text>
        <text y="192">9</text>
        <text y="216">10</text>
        <text y="240">11</text>
        <text y="264">12</text>
        <text y="288">13</text>
        <text y="312">14</text>
        <text y="336">15</text>
      </g>

      <!-- Code Content -->
      <g font-family="'JetBrains Mono', monospace" font-size="13" transform="translate(60, 25)">
        <text y="0" fill="#4d5062">// Fast dispatch loop</text>
        <text y="48"><tspan fill="#ffffff" font-weight="700">#include</tspan> <tspan fill="#888899">&lt;stdio.h&gt;</tspan></text>
        <text y="72"><tspan fill="#ffffff" font-weight="700">#include</tspan> <tspan fill="#888899">&lt;xvim/core.h&gt;</tspan></text>

        <text y="120"><tspan fill="#ffffff" font-weight="700">int</tspan> <tspan fill="#ffffff">main</tspan>(<tspan fill="#ffffff" font-weight="700">int</tspan> argc, <tspan fill="#ffffff" font-weight="700">char</tspan> **argv) {</text>
        <text y="144" fill="#888899">    xvim_ctx_t ctx = {0};</text>
        
        <text y="192"><tspan fill="#ffffff" font-weight="700">    if</tspan> (!xvim_init(&amp;ctx)) {</text>
        <text y="216"><tspan fill="#ffffff">        return</tspan> 1;</text>
        <text y="240">    }</text>

        <text y="288" fill="#888899">    // Non-blocking event dispatch</text>
        <text y="312"><tspan fill="#ffffff">    xvim_dispatch</tspan>(&amp;ctx);</text>
        <text y="336">}</text>
      </g>

      <!-- Blink.cmp Completion Menu -->
      <g transform="translate(190, 240)">
        <rect width="320" height="180" rx="6" fill="#12131a" stroke="#262734" stroke-width="1" />
        <rect width="320" height="24" rx="6" fill="#171822" />
        <text x="12" y="16" fill="#757991" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">COMPLETION (blink.cmp)</text>

        <g transform="translate(0, 24)" font-family="'JetBrains Mono', monospace" font-size="12">
          <rect x="0" y="0" width="320" height="28" fill="#202230" />
          <text x="14" y="19" fill="#27c93f" font-weight="700">󰊕  xvim_dispatch</text>
          <text x="305" y="19" fill="#888899" font-size="10" text-anchor="end">fn(&amp;ctx)</text>

          <text x="14" y="47" fill="#ffffff">󰊕  xvim_init</text>
          <text x="305" y="47" fill="#52556b" font-size="10" text-anchor="end">fn(&amp;ctx)</text>

          <text x="14" y="75" fill="#ffffff">󰈙  xvim_ctx_t</text>
          <text x="305" y="75" fill="#52556b" font-size="10" text-anchor="end">struct</text>

          <text x="14" y="103" fill="#ffffff">󰊕  xvim_render</text>
          <text x="305" y="103" fill="#52556b" font-size="10" text-anchor="end">fn()</text>

          <text x="14" y="131" fill="#ffffff">󰈙  xvim_buffer_t</text>
          <text x="305" y="131" fill="#52556b" font-size="10" text-anchor="end">struct</text>
        </g>
      </g>

      <!-- Doc Preview -->
      <g transform="translate(530, 240)">
        <rect width="330" height="130" rx="6" fill="#0e0f14" stroke="#1f202b" stroke-width="1" />
        <text x="14" y="22" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11">void xvim_dispatch(xvim_ctx_t *ctx)</text>
        <line x1="14" y1="32" x2="316" y2="32" stroke="#1a1b24" stroke-width="1" />
        <text x="14" y="54" fill="#888899" font-family="'JetBrains Mono', monospace" font-size="11">Flushes pending render pipeline and processes</text>
        <text x="14" y="72" fill="#888899" font-family="'JetBrains Mono', monospace" font-size="11">queued input packets with zero allocation.</text>
        <text x="14" y="100" fill="#27c93f" font-family="'JetBrains Mono', monospace" font-size="10.5">Latency: ~0.02ms</text>
      </g>
    </g>
  </g>

  <!-- Diagnostics bar -->
  <g transform="translate(0, 649)">
    <rect width="1200" height="43" fill="#0b0c10" stroke="#1a1b24" stroke-width="1"/>
    <text x="24" y="26" fill="#27c93f" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">✓ 0 Errors   ▲ 0 Warnings   clangd: ready</text>
    <text x="1176" y="26" fill="#52556b" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">conform: formatted</text>
