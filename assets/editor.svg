      <!-- Code Content -->
      <g font-family="'JetBrains Mono', monospace" font-size="13" transform="translate(60, 25)">
        <text y="0" fill="#585c70">// ==============================================================================</text>
        <text y="24" fill="#585c70">// ⚡ XVIM Core Engine — Apple Silicon M4 Vectorized Dispatcher</text>
        <text y="48" fill="#585c70">// ==============================================================================</text>
        
        <text y="96"><tspan fill="#ffffff" font-weight="700">#include</tspan> <tspan fill="#9fa3b8">&lt;xvim/engine.h&gt;</tspan></text>
        <text y="120"><tspan fill="#ffffff" font-weight="700">#include</tspan> <tspan fill="#9fa3b8">&lt;arm_neon.h&gt;</tspan></text>

        <text y="168"><tspan fill="#ffffff" font-weight="700">static inline void</tspan> <tspan fill="#ffffff">xvim_accelerate_render</tspan>(<tspan fill="#a0a4b8">xvim_context_t</tspan> *ctx) {</text>
        <text y="192" fill="#8f93a9">    uint64_t start_cycles = __builtin_arm_rsr64("CNTVCT_EL0");</text>
        
        <text y="240"><tspan fill="#ffffff" font-weight="700">    if</tspan> (__builtin_expect(!ctx-&gt;is_initialized, 0)) {</text>
        <text y="264"><tspan fill="#ffffff">        xvim_bootstrap_runtime</tspan>(ctx);</text>
        <text y="288">    }</text>

        <text y="336" fill="#8f93a9">    // Direct dispatch to LuaJIT state machine</text>
        <text y="360"><tspan fill="#ffffff">    xvim_dispatch_events</tspan>(ctx-&gt;state);</text>
        <text y="384">}</text>
      </g>

      <!-- Blink.cmp Completion Menu -->
      <g transform="translate(190, 260)">
        <rect width="330" height="190" rx="8" fill="#12131b" stroke="#2c2f40" stroke-width="1.2" />
