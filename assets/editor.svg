<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <rect width="1200" height="740" rx="10" fill="#0c0d12" stroke="#23242e" stroke-width="1.5" />

  <!-- Titlebar -->
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 1190 0 A 10 10 0 0 1 1200 10 L 1200 38 L 0 38 Z" fill="#13141a" />
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#1f202b" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="24" cy="19" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="19" r="5.5" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="600.0" y="24" fill="#6d7085" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" text-anchor="middle">src/main.c — xvim</text>

  <!-- Body Content -->
  
  <!-- Header Tabs -->
  <g transform="translate(0, 38)">
    <rect width="1200" height="32" fill="#0f1016" />
    <rect x="0" y="0" width="220" height="32" fill="#0d0e14" />
    <text x="20" y="21" fill="#6d7085" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">EXPLORER</text>
    <line x1="220" y1="0" x2="220" y2="32" stroke="#1f202b" stroke-width="1" />

    <!-- Active Tab -->
    <rect x="220" y="0" width="160" height="32" fill="#14151f" stroke="#1f202b" stroke-width="1"/>
