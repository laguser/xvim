<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <rect width="1200" height="740" rx="10" fill="#0c0d12" stroke="#23242e" stroke-width="1.5" />

  <!-- Titlebar -->
  <path d="M 0 10 A 10 10 0 0 1 10 0 L 1190 0 A 10 10 0 0 1 1200 10 L 1200 38 L 0 38 Z" fill="#13141a" />
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#1f202b" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="24" cy="19" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="19" r="5.5" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="600.0" y="24" fill="#6d7085" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" text-anchor="middle">xvim — dashboard</text>

  <!-- Body Content -->
  
  <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Monaco, monospace" xml:space="preserve">
    <!-- ASCII Art Logo -->
    <g fill="#ffffff" font-weight="700" text-anchor="middle" font-size="16" transform="translate(600, 105)">
      <text y="0">    \       /   </text>
      <text y="21">     \     /    </text>
      <text y="42">      \   /     </text>
      <text y="63">       \ /      </text>
      <text y="84" fill="#ffffff" font-size="20">        X       </text>
      <text y="105">       / \      </text>
      <text y="126">      /   \     </text>
      <text y="147">     /     \    </text>
      <text y="168">    /       \   </text>
    </g>

    <text x="600" y="325" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="8">X   V   I   M</text>
    <text x="600" y="352" fill="#52556b" font-size="11.5" text-anchor="middle" font-weight="500">LINUX &amp; MACOS  •  MONOCHROME NOIR</text>

    <!-- Dashboard Actions -->
    <g transform="translate(440, 395)" font-size="13">
      <!-- Item 1: Find File -->
      <rect x="0" y="0" width="320" height="34" rx="6" fill="#121319" stroke="#1c1d26" stroke-width="1"/>
      <text x="18" y="22" fill="#ffffff" font-weight="700">f</text>
      <text x="42" y="22" fill="#888899">Find File</text>
      <text x="302" y="22" fill="#484a5c" text-anchor="end">spc f f</text>

      <!-- Item 2: Recent Files -->
      <rect x="0" y="44" width="320" height="34" rx="6" fill="#121319" stroke="#1c1d26" stroke-width="1"/>
      <text x="18" y="66" fill="#ffffff" font-weight="700">r</text>
      <text x="42" y="66" fill="#888899">Recent Files</text>
      <text x="302" y="66" fill="#484a5c" text-anchor="end">spc f r</text>

      <!-- Item 3: XVim Tutor (Highlighted) -->
      <rect x="0" y="88" width="320" height="34" rx="6" fill="#171822" stroke="#ffffff" stroke-width="1"/>
      <text x="18" y="110" fill="#27c93f" font-weight="800">t</text>
      <text x="42" y="110" fill="#ffffff" font-weight="700">XVim Tutor</text>
      <text x="140" y="110" fill="#27c93f" font-size="11">[ru/en]</text>
      <text x="302" y="110" fill="#888899" text-anchor="end">spc t u</text>

      <!-- Item 4: Config -->
      <rect x="0" y="132" width="320" height="34" rx="6" fill="#121319" stroke="#1c1d26" stroke-width="1"/>
      <text x="18" y="154" fill="#ffffff" font-weight="700">c</text>
      <text x="42" y="154" fill="#888899">Config Settings</text>
      <text x="302" y="154" fill="#484a5c" text-anchor="end">spc f c</text>

      <!-- Item 5: Quit -->
      <rect x="0" y="176" width="320" height="34" rx="6" fill="#121319" stroke="#1c1d26" stroke-width="1"/>
      <text x="18" y="198" fill="#ffffff" font-weight="700">q</text>
      <text x="42" y="198" fill="#888899">Quit</text>
      <text x="302" y="198" fill="#484a5c" text-anchor="end">spc q</text>
    </g>

    <!-- Startup Pill Badge -->
    <g transform="translate(600, 645)">
      <rect x="-140" y="-13" width="280" height="26" rx="13" fill="#12131a" stroke="#1f202b" stroke-width="1"/>
      <text x="0" y="4" fill="#888899" font-size="11.5" text-anchor="middle">
        ⚡ loaded <tspan fill="#ffffff" font-weight="700">38 plugins</tspan> in <tspan fill="#27c93f" font-weight="700">20.9ms</tspan>
      </text>
    </g>

    <!-- Statusline -->
    <g transform="translate(0, 692)">
      <rect width="1200" height="28" fill="#090a0e" />
      <path d="M 12 5 A 8 8 0 0 1 20 5 L 85 5 A 8 8 0 0 1 93 13 L 93 15 A 8 8 0 0 1 85 23 L 20 23 A 8 8 0 0 1 12 15 Z" fill="#ffffff" />
      <text x="52" y="18" fill="#000000" font-weight="800" font-size="11" text-anchor="middle">NORMAL</text>
      <text x="110" y="18" fill="#6d7085" font-size="11.5">xvim://dashboard</text>
      <text x="1050" y="18" fill="#52556b" font-size="11.5">utf-8</text>
      <path d="M 1095 5 A 8 8 0 0 1 1103 5 L 1180 5 A 8 8 0 0 1 1188 13 L 1188 15 A 8 8 0 0 1 1180 23 L 1103 23 A 8 8 0 0 1 1095 15 Z" fill="#181922" />
      <text x="1141" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">20.9ms</text>
    </g>
  </g>

</svg>