<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" rx="14" fill="#0c0d12" stroke="#252733" stroke-width="2" />

  <!-- Titlebar -->
  <path d="M 0 14 A 14 14 0 0 1 14 0 L 1186 0 A 14 14 0 0 1 1200 14 L 1200 42 L 0 42 Z" fill="#13141a" />
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1f202b" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="28" cy="21" r="6" fill="#ff5f56" />
  <circle cx="48" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="600.0" y="26" fill="#757991" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Benchmark: Cold &amp; Warm Startup Latency on Apple Silicon M4</text>

  <!-- Body Content -->
  
  <!-- Body -->
  <g transform="translate(45, 75)" font-family="'JetBrains Mono', 'Fira Code', monospace">
    <text x="0" y="25" fill="#ffffff" font-size="20" font-weight="800">⚡ STARTUP TIME LATENCY COMPARISON</text>
    <text x="0" y="50" fill="#6d7085" font-size="13">Tested on Apple M4 (16GB RAM, macOS Sequoia 15.x) • Lower is better</text>

    <!-- Bar 1: XVIM -->
    <g transform="translate(0, 90)">
      <text x="0" y="20" fill="#ffffff" font-size="15" font-weight="800">XVIM (M4 ThinLTO + LuaJIT Bytecode Cache)</text>
      <text x="440" y="20" fill="#27c93f" font-size="15" font-weight="800">20.9 ms</text>
      <rect x="0" y="32" width="220" height="28" rx="6" fill="#27c93f" />
      <rect x="220" y="32" width="870" height="28" rx="6" fill="#14151e" />
      <text x="235" y="51" fill="#8f93a9" font-size="11.5">~3.3x faster than standard setups (38 full plugins loaded)</text>
    </g>

    <!-- Bar 2: Stock Helix -->
    <g transform="translate(0, 180)">
      <text x="0" y="20" fill="#a0a4b8" font-size="14" font-weight="600">Stock Helix 24.03</text>
      <text x="440" y="20" fill="#ffffff" font-size="14" font-weight="600">34.8 ms</text>
      <rect x="0" y="32" width="365" height="28" rx="6" fill="#55586d" />
      <rect x="365" y="32" width="725" height="28" rx="6" fill="#14151e" />
    </g>

    <!-- Bar 3: Default LazyVim -->
    <g transform="translate(0, 270)">
      <text x="0" y="20" fill="#a0a4b8" font-size="14" font-weight="600">Generic Neovim + LazyVim Full</text>
      <text x="440" y="20" fill="#ffbd2e" font-size="14" font-weight="600">68.4 ms</text>
      <rect x="0" y="32" width="718" height="28" rx="6" fill="#3f4255" />
      <rect x="718" y="32" width="372" height="28" rx="6" fill="#14151e" />
    </g>

    <!-- Bar 4: VSCode ARM64 -->
    <g transform="translate(0, 360)">
      <text x="0" y="20" fill="#757991" font-size="14">VSCode (macOS ARM64)</text>
      <text x="440" y="20" fill="#ff5f56" font-size="14">420.0 ms</text>
      <rect x="0" y="32" width="1090" height="28" rx="6" fill="#242634" />
    </g>

    <!-- Bottom Summary Box -->
    <g transform="translate(0, 465)">
      <rect width="1090" height="46" rx="8" fill="#13141f" stroke="#252739" stroke-width="1"/>
      <text x="24" y="28" fill="#a0a4b8" font-size="12">
        Verified with <tspan fill="#ffffff" font-weight="700">xvim --benchmark</tspan> : 5 consecutive runs averaged at <tspan fill="#27c93f" font-weight="700">20.91ms</tspan> with full LSP &amp; UI plugins loaded.
      </text>
    </g>
  </g>

</svg>